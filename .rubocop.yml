AllCops:
  NewCops: enable
  Exclude:
    - 'coverage/**/*'

Metrics/MethodLength:
  Max: 30

Metrics/CyclomaticComplexity:
  Max: 10

Style/Documentation:
  Enabled: false

Metrics/AbcSize:
  Max: 25

Metrics/ModuleLength:
  Max: 150

Metrics/PerceivedComplexity:
  Max: 10

Metrics/ParameterLists:
  Max: 8

Naming/FileName:
  Exclude:
    - 'lib/angus-remote.rb'

RSpec/VerifiedDoubles:
  Enabled: false

RSpec/AnyInstance:
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Max: 10

RSpec/NestedGroups:
  Max: 5

plugins:
  - rubocop-performance
  - rubocop-rspec
  - rubocop-thread_safety
